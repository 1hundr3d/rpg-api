name: CI

on:
    push: 
        branches: ["main"]
    
    pull_request: 
        branches: ["main"]
jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpass
                    POSTGRES_DB: testdb
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        
        env:
            DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
            TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
            SECRET_KEY: supersecretkeyforci
        
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                 pip install --upgrade pip
                 pip install -r requirements.txt

            - name: Wait for postgresql to be ready
              run: |
                 for i in {1..10}; do
                    pg_isready -h localhost -p 5432 -U testuser -d testdb && break
                    echo "Waiting for DB"
                    sleep 2
                 done
            
            - name: Run Alembic migrations
              run: alembic upgrade head

            - name: Run tests 
              run: pytest test_rpg_api.py -v
    build:
        runs-on: ubuntu-latest
        needs: test
        permissions: 
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                 registry: ghcr.io
                 username: ${{ github.actor }}
                 password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker image
              uses: docker/build-push-action@v6
              with:
                 context: .
                 push: true
                 tags: |
                   ghcr.io/1hundr3d/rpg-api:latest
                   ghcr.io/1hundr3d/rpg-api:${{ github.sha }}
            - name: Trigger Render Deploy
              run:
                 curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"